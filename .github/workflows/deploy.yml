name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: "App to deploy (tradequote|inkmanager|invoiceflow)"
        required: false
        default: tradequote

permissions:
  contents: read

env:
  # Preempt GitHub Actions Node.js 20 deprecation warnings and upcoming default changes.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP: ${{ github.event.inputs.app || 'tradequote' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select active app
        run: ./scripts/switch-app.sh "$APP"

      - name: Verify repo is deployable
        run: |
          if [ ! -d "active-app" ]; then
            echo "active-app is missing. This workflow expects ./scripts/switch-app.sh to create it."
            exit 1
          fi
          if [ ! -f "active-app/package.json" ]; then
            echo "No Next.js app detected at active-app (missing active-app/package.json)."
            echo "Place your Next.js app source in apps/$APP and commit the necessary files (including package.json)."
            exit 1
          fi

      - name: Verify required secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          missing=()
          for name in \
            VERCEL_TOKEN \
            VERCEL_ORG_ID \
            VERCEL_PROJECT_ID \
            NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_ANON_KEY \
            STRIPE_SECRET_KEY \
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY \
            STRIPE_WEBHOOK_SECRET; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required GitHub Actions secrets:"
            printf ' - %s\n' "${missing[@]}"
            echo ""
            echo "Set these in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Setup Node (cached)
        if: ${{ hashFiles('active-app/package-lock.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: active-app/package-lock.json

      - name: Setup Node
        if: ${{ hashFiles('active-app/package-lock.json') == '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f active-app/package-lock.json ]; then
            cd active-app && npm ci
          elif [ -f active-app/package.json ]; then
            cd active-app && npm install
          else
            echo "No active-app/package.json found; nothing to install"
            exit 1
          fi

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
