name: Deploy to Cloud Run from Source

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      app:
        description: App to deploy
        required: true
        default: tradequote
        type: choice
        options:
          - tradequote
          - inkmanager
          - invoiceflow

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE: ${{ secrets.GCP_CLOUD_RUN_SERVICE }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      APP: ${{ github.event.inputs.app || 'tradequote' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select app
        run: ./scripts/switch-app.sh "$APP"

      - name: Validate Cloud Run configuration
        shell: bash
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
        run: |
          set -euo pipefail
          missing=0
          for pair in \
            "GCP_PROJECT_ID:${PROJECT_ID:-}" \
            "GCP_REGION:${REGION:-}" \
            "GCP_CLOUD_RUN_SERVICE:${SERVICE:-}" \
            "GCP_WORKLOAD_IDENTITY_PROVIDER:${WORKLOAD_IDENTITY_PROVIDER:-}" \
            "GCP_SERVICE_ACCOUNT_EMAIL:${SERVICE_ACCOUNT:-}"; do
            key="${pair%%:*}"
            value="${pair#*:}"
            if [ -z "$value" ]; then
              echo "❌ Missing required secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          source: ./active-app

      - name: Show output
        run: echo "Cloud Run URL: ${{ steps.deploy.outputs.url }}"
